# RTX 5090 (32 GB) variant of docker-compose.yml, for the default 26B-A4B.
# Tested on a headless machine with the card dedicated to the model.
#
# The stock file does not start on a 32 GB card: after the weights and the
# activation peak at --max-num-batched-tokens 32768, it is left with 7.47 GiB
# of KV cache against the 8.85 GiB one 262,144-token request needs. Two deltas:
#   - --max-num-batched-tokens 8192, which frees the memory and keeps the full
#     context (see the note on the flag).
#   - MTP speculative decoding is on, unlike the other compose files here:
#     279.0 tok/s single-stream against 220.5 without it, for 1.3 GiB of KV.
#
# Measured budget at 0.92 of 32,607 MiB:
#
#   weights (target + MTP drafter)  16.91 GiB
#   CUDA graphs                      0.60 GiB
#   activation + non-torch          ~2.1  GiB   (at --max-num-batched-tokens 8192)
#   KV cache                         9.64 GiB   -> 607,331 tokens, 2.32x the 262k context
#
# That is a start that loads the compile cache. The first start on a machine,
# which compiles from scratch, profiled 9.05 GiB of KV (570,250 tokens).
#
# --gpu-memory-utilization stays at 0.92. Under load, usage runs about 1 GiB
# past that budget but stays clear of the card: under 64 concurrent 8k
# prompts, 16 concurrent 4-image prompts at max_soft_tokens 1120, and two
# concurrent 250k-token prompts, it peaked at 31,092 of 32,607 MiB with no
# failures. A desktop session or any other CUDA process on the card eats into
# that ~1.5 GiB of headroom.
#
# Select this file via .env so ./start.sh works unchanged:
#   COMPOSE_FILE=docker-compose.rtx5090.yml
services:
  vllm:
    # Gemma 4 needs vLLM >= 0.24.0; the Gemma 4 sliding-window/FA4 attention
    # fixes landed in v0.25.1, and the image bundles the flashinfer +
    # cutlass-dsl versions the unsloth NVFP4 cute-DSL W4A4 path requires
    image: vllm/vllm-openai:v0.30.0
    container_name: vllm-gemma4
    restart: unless-stopped
    ipc: host
    ports:
      - "8000:8000"
    environment:
      - HF_TOKEN=${HF_TOKEN?Set HF_TOKEN in .env or export it}
      - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
      # HF_HOME alone is enough: the hub cache derives as $HF_HOME/hub. Pointing
      # HUGGINGFACE_HUB_CACHE at the HF_HOME root instead lands weights in
      # $HF_HOME/models--* rather than $HF_HOME/hub/models--*, so the container
      # ignores the weights the host already has and re-downloads them.
      - HF_HOME=/root/.cache/huggingface
    volumes:
      - huggingface_cache:/root/.cache/huggingface
      # persist torch.compile + FlashInfer autotune caches across container
      # recreation: warm start in minutes instead of a full recompile
      - vllm_cache:/root/.cache/vllm
    command:
      # the model is passed positionally; it overrides --model if both are given
      - "unsloth/gemma-4-26B-A4B-it-NVFP4"
      - "--served-model-name"
      - "gemma-4-26b-a4b"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8000"
      # no --quantization flag: auto-detects compressed-tensors; forcing a backend
      # (e.g. marlin) costs ~2x decode throughput vs the auto-picked NVFP4 kernel
      # the checkpoint ships calibrated fp8 KV scales, so fp8 KV cache is lossless-ish
      - "--kv-cache-dtype"
      - "fp8"
      - "--gpu-memory-utilization"
      - "0.92"
      - "--max-model-len"
      - "262144"
      - "--max-num-seqs"
      - "64"
      # 8192, down from 32768, for memory: the activation peak scales with it
      # and comes straight out of the KV pool. KV tokens at 0.92, measured
      # without MTP: 32768 does not start, 16384 gives 448,664, 8192 687,683,
      # 4096 888,194 (4096 is the floor; see README Tuning). Prefill does not
      # care: 8k, 32k and 100k prompts take the same time at 8192 as at 16384
      # (183 ms, 1.11 s, 6.9 s).
      - "--max-num-batched-tokens"
      - "8192"
      - "--reasoning-parser"
      - "gemma4"
      - "--enable-auto-tool-choice"
      - "--tool-call-parser"
      - "gemma4"
      # no --chat-template override: the unsloth checkpoint bundles a template
      # that already renders tools and supports enable_thinking
      - "--limit-mm-per-prompt"
      - '{"image": 4}'
      # On here, off in the other compose files: +27% single-stream (279.0 vs
      # 220.5 tok/s) and +32% at 8 streams, at 53% acceptance. k=2 per the
      # README's speculative decoding section.
      - "--speculative-config"
      - '{"model": "google/gemma-4-26B-A4B-it-assistant", "num_speculative_tokens": 2}'
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 600s

volumes:
  huggingface_cache:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${HOME}/.cache/huggingface
  vllm_cache:
