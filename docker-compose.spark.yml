# NVIDIA DGX Spark (GB10) variant of docker-compose.yml.
#
# The GB10's ~120 GB of memory is *unified* — the GPU and the OS share it.
# The deltas from the default file exist because of that:
#   - --gpu-memory-utilization is lower: high fractions of unified memory starve
#     the kernel and livelock the host (NVRM NV_ERR_NO_MEMORY, hard power cycle).
#     0.78 was tuned on this hardware for the Qwen3.6 sibling repo; the same
#     ceiling applies here (it is a host-memory constraint, not a model one).
#   - Disabling swap on the host is strongly recommended so memory exhaustion
#     OOM-kills the engine (container restarts) instead of thrashing:
#     sudo swapoff -a && comment the swap line in /etc/fstab.
#
# Select this file via .env so ./start.sh works unchanged:
#   COMPOSE_FILE=docker-compose.spark.yml
services:
  vllm:
    # Gemma 4 needs vLLM >= 0.24.0; the Gemma 4 sliding-window/FA4 attention
    # fixes landed in v0.25.1, and the image bundles the flashinfer +
    # cutlass-dsl versions the unsloth NVFP4 cute-DSL W4A4 path requires
    image: vllm/vllm-openai:v0.27.1
    container_name: vllm-gemma4
    restart: unless-stopped
    ipc: host
    ports:
      - "8000:8000"
    environment:
      - HF_TOKEN=${HF_TOKEN?Set HF_TOKEN in .env or export it}
      - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
      # HF_HOME alone is enough: the hub cache derives as $HF_HOME/hub. Pointing
      # HUGGINGFACE_HUB_CACHE at the HF_HOME root instead lands weights in
      # $HF_HOME/models--* rather than $HF_HOME/hub/models--*, so the container
      # ignores the weights the host already has and re-downloads them.
      - HF_HOME=/root/.cache/huggingface
    volumes:
      - huggingface_cache:/root/.cache/huggingface
      # persist torch.compile + FlashInfer autotune caches across container
      # recreation: warm start in minutes instead of a full recompile
      - vllm_cache:/root/.cache/vllm
    # The v0.27.x images bundle transformers 5.15.0, whose heterogeneous
    # per-layer configs raise on any global access to Gemma 4's head_dim, so
    # the engine dies at startup (vllm-project/vllm#51744 — fixed on main,
    # not yet in a release). Pin the last working transformers at container
    # start; drop this override once a release ships the fix.
    entrypoint:
      - bash
      - -c
      - |
        pip install -q --root-user-action=ignore transformers==5.14.1
        exec vllm serve "$@"
      - --
    command:
      # the model is passed positionally; it overrides --model if both are given
      - "unsloth/gemma-4-26B-A4B-it-NVFP4"
      - "--served-model-name"
      - "gemma-4-26b-a4b"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8000"
      # no --quantization flag: auto-detects compressed-tensors; forcing a backend
      # (e.g. marlin) costs ~2x decode throughput vs the auto-picked NVFP4 kernel
      # the checkpoint ships calibrated fp8 KV scales, so fp8 KV cache is lossless-ish
      - "--kv-cache-dtype"
      - "fp8"
      # fraction of *unified* memory; the remainder is all the OS gets (see header).
      # On the Qwen3.6 sibling repo 0.85 measured unsafe (host MemAvailable dropped
      # below 5 GiB during KV-cache allocation); 0.78 keeps the worst case >= ~13 GiB.
      - "--gpu-memory-utilization"
      - "0.78"
      - "--max-model-len"
      - "262144"
      - "--max-num-seqs"
      - "64"
      - "--max-num-batched-tokens"
      - "32768"
      - "--reasoning-parser"
      - "gemma4"
      - "--enable-auto-tool-choice"
      - "--tool-call-parser"
      - "gemma4"
      # no --chat-template override: the unsloth checkpoint bundles a template
      # that already renders tools and supports enable_thinking
      - "--limit-mm-per-prompt"
      - '{"image": 4}'
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      # cold start (empty vllm_cache) compiles everything: allow 15 min
      start_period: 900s

volumes:
  huggingface_cache:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${HOME}/.cache/huggingface
  vllm_cache:
