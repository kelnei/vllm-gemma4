services:
  vllm:
    # Gemma 4 needs vLLM >= 0.24.0; v0.25.1 adds Gemma 4 sliding-window/FA4
    # attention fixes and bundles the flashinfer + cutlass-dsl versions the
    # unsloth NVFP4 cute-DSL W4A4 path requires
    image: vllm/vllm-openai:v0.25.1
    container_name: vllm-gemma4
    restart: unless-stopped
    ipc: host
    ports:
      - "8000:8000"
    environment:
      - HF_TOKEN=${HF_TOKEN?Set HF_TOKEN in .env or export it}
      - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
      - HF_HOME=/root/.cache/huggingface
      - HUGGINGFACE_HUB_CACHE=/root/.cache/huggingface
    volumes:
      - huggingface_cache:/root/.cache/huggingface
      # persist torch.compile + FlashInfer autotune caches across container
      # recreation: warm start in minutes instead of a full recompile
      - vllm_cache:/root/.cache/vllm
    command:
      - "--model"
      - "unsloth/gemma-4-26B-A4B-it-NVFP4"
      - "--served-model-name"
      - "gemma-4-26b-a4b"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8000"
      # no --quantization flag: auto-detects compressed-tensors; forcing a backend
      # (e.g. marlin) costs ~2x decode throughput vs the auto-picked NVFP4 kernel
      # the checkpoint ships calibrated fp8 KV scales, so fp8 KV cache is lossless-ish
      - "--kv-cache-dtype"
      - "fp8"
      - "--gpu-memory-utilization"
      - "0.92"
      - "--max-model-len"
      - "262144"
      - "--max-num-seqs"
      - "64"
      - "--max-num-batched-tokens"
      - "32768"
      - "--reasoning-parser"
      - "gemma4"
      - "--enable-auto-tool-choice"
      - "--tool-call-parser"
      - "gemma4"
      # no --chat-template override: the unsloth checkpoint bundles a template
      # that already renders tools and supports enable_thinking
      - "--limit-mm-per-prompt"
      - '{"image": 4}'
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 600s

volumes:
  huggingface_cache:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${HOME}/.cache/huggingface
  vllm_cache:
